<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO -->
    <title>Contact ConvertNova | Get Support & Assistance</title>

    <meta name="description"
        content="Contact ConvertNova for support, questions, feedback, or business inquiries. We're here to help with our free online file conversion tools.">

    <meta name="author" content="ConvertNova">

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

    <!-- Canonical -->
    <link rel="canonical" href="https://convertnovas.com/contact-us">

    <!-- Open Graph -->
    <meta property="og:type" content="website">

    <meta property="og:site_name" content="ConvertNova">

    <meta property="og:title" content="Contact ConvertNova | Get Support & Assistance">

    <meta property="og:description"
        content="Need help? Contact ConvertNova for support, feedback, or business inquiries regarding our online file conversion tools.">

    <meta property="og:url" content="https://convertnovas.com/contact-us">

    <meta property="og:image" content="https://convertnovas.com/images/og-image.png">

    <meta property="og:image:alt" content="ConvertNova Contact Support">

    <meta property="og:locale" content="en_US">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Contact ConvertNova | Get Support & Assistance">

    <meta name="twitter:description"
        content="Contact ConvertNova for support, feedback, or questions about our free online file conversion tools.">

    <meta name="twitter:image" content="https://convertnovas.com/images/og-image.png">

    <!-- Theme -->
    <meta name="theme-color" content="#0d6efd">

    <meta name="color-scheme" content="light">

    <!-- Favicon -->
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/footer.css}">

     <link rel="stylesheet" th:href="@{/css/contact-us.css}">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">

     <link rel="stylesheet" th:href="@{/css/page.css}">


    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "name": "Contact ConvertNova",
      "url": "https://convertnovas.com/contact-us",
      "description": "Contact ConvertNova for support, questions, feedback, or business inquiries.",
      "publisher": {
        "@type": "Organization",
        "name": "ConvertNova",
        "url": "https://convertnovas.com"
      }
    }
    </script>

</head>

<body>

    <!-- Navbar -->

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="tools-hero">

        <div class="container text-center">

            <h1>

                Contact Us

            </h1>

            <p>

                Questions, suggestions or feedback?
                We'd love to hear from you.

            </p>

        </div>

    </section>

    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card border-0 shadow-sm p-5">

                    <h2 class="mb-4">

                        Get In Touch

                    </h2>

                    <form>

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input type="text" class="form-control" placeholder="Enter your name">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email Address

                            </label>

                            <input type="email" id="email" name="email" class="form-control" placeholder="Your Email">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Subject

                            </label>

                            <input type="text" class="form-control" placeholder="Subject">

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Message

                            </label>

                            <textarea class="form-control" rows="6" placeholder="Write your message"></textarea>

                        </div>

                        <button type="submit" class="btn btn-primary">

                            Send Message

                        </button>

                    </form>

                    <hr class="my-5">

                    <h3>

                        Support Information

                    </h3>

                    <p>

                        For support requests, bug reports,
                        partnership inquiries or feedback,
                        please contact us using the form above.

                    </p>

                    <p>

                        We aim to respond as quickly as possible.

                    </p>

                </div>

            </div>

        </div>

    </section>


    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/contact-us.js"></script>

    <script src="/js/email-valid.js"></script>

</body>

</html>
